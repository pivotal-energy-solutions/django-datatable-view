# TEMPORARY: proves release.yml's private install on the current runner image. Removed before merge.
name: Verify token auth (temporary)

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]  # images roll out gradually; spread to land on a new one
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Toolchain
        run: |
          echo "ImageVersion=$ImageVersion"
          git --version
          dpkg -s curl | grep '^Version'
      - name: Install dependencies
        uses: ./.github/actions/github-auth
        with:
          token: ${{ secrets.ORGANIZATIONAL_REPO_TOKEN }}
          run: pip install git+https://github.com/pivotal-energy-solutions/tensor-infrastructure@master#egg=infrastructure
      - name: Header removed
        run: |
          if git config --global --get-all http.https://github.com/pivotal-energy-solutions/.extraheader >/dev/null; then
            echo "header still set"; exit 1
          fi
          python -c "import infrastructure; print('infrastructure import ok')"
          pip show infrastructure | grep '^Version'
          command -v bumper
